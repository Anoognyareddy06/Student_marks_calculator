<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Student Marks Calculator</h2>
    
    <label>Student Name:</label>
    <input type="text" id="studentName" placeholder="Enter name">

    <label>Subject 1 Marks:</label>
    <input type="number" id="sub1" placeholder="0 - 100">

    <label>Subject 2 Marks:</label>
    <input type="number" id="sub2" placeholder="0 - 100">

    <label>Subject 3 Marks:</label>
    <input type="number" id="sub3" placeholder="0 - 100">

    <button onclick="calculateResult()">Calculate Grade</button>

    <div class="result" id="resultBox">
        <p id="resName"></p>
        <p id="resTotal"></p>
        <p id="resPercent"></p>
        <p id="resGrade"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
